---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clarity-api
  namespace: clarity
  labels:
    app: clarity-api
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clarity-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime rolling deploy
  template:
    metadata:
      labels:
        app: clarity-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: clarity-api:latest   # replace with your registry path
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: clarity-config
            - secretRef:
                name: clarity-secrets    # create separately with kubectl create secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]   # drain in-flight requests before SIGTERM
---
apiVersion: v1
kind: Service
metadata:
  name: clarity-api
  namespace: clarity
spec:
  selector:
    app: clarity-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clarity-api-hpa
  namespace: clarity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clarity-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

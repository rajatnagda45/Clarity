---
# Redis Deployment
#
# PRODUCTION NOTE: This single-replica deployment is suitable for development
# and staging only. For production enterprise deployments use a managed HA
# Redis service instead:
#
#   Option A (Recommended): Upstash Redis — serverless, multi-region HA
#     Set REDIS_URL=rediss://<host>:<port> in clarity-secrets and remove
#     this Deployment + Service. Upstash handles HA, backups, and scaling.
#
#   Option B: AWS ElastiCache for Redis (Multi-AZ with automatic failover)
#     Set REDIS_URL=rediss://<elasticache-endpoint>:6380 in clarity-secrets.
#
#   Option C: Redis Sentinel (self-hosted HA)
#     Deploy 1 primary + 2 replicas + 3 Sentinel processes.
#     Set REDIS_URL=redis+sentinel://<sentinel-host>:26379/mymaster in clarity-secrets.
#
# Data durability: emptyDir below loses all data on pod restart (jobs lost,
# rate limits reset). Replace with a PersistentVolumeClaim for stateful persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: clarity
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - "60"
            - "1"
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clarity-secrets
                  key: REDIS_PASSWORD
                  optional: true
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
          # For persistent storage, replace emptyDir with a PVC:
          # persistentVolumeClaim:
          #   claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: clarity
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

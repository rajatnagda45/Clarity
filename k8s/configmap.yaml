apiVersion: v1
kind: ConfigMap
metadata:
  name: clarity-config
  namespace: clarity
data:
  # Non-sensitive runtime config — sensitive values go in the Secret
  ENVIRONMENT: "production"
  REDIS_URL: "redis://redis:6379/0"
  WORKER_MAX_JOBS: "10"
  WORKER_JOB_TIMEOUT: "3600"
  WORKER_MAX_TRIES: "3"
  WORKER_KEEP_RESULT: "86400"
  LOG_LEVEL: "INFO"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "clarity-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

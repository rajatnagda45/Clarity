# ─────────────────────────────────────────────────────────────────────────────
# Clarity AI Docs — local development + production-mirrored stack
#
# Services:
#   redis   — job queue backend and distributed cache
#   api     — FastAPI application server (2 uvicorn workers)
#   worker  — ARQ job consumers (scale to N with --scale worker=N)
#
# Usage:
#   docker compose up                      # start all services
#   docker compose up --scale worker=4    # 4 worker replicas
#   docker compose logs -f worker          # tail worker logs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── API server ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── ARQ worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      WORKER_MAX_JOBS: "10"
      WORKER_JOB_TIMEOUT: "3600"
      WORKER_MAX_TRIES: "3"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  redis_data:
    driver: local
